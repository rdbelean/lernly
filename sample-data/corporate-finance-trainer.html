<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Corporate Finance & Valuation · Lernly Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" onload="window.lernlyMath&&window.lernlyMath(document.body)"></script>
<style>
/* Lernly trainer template. Fixed engine; course content is injected as JSON by build_trainer.py. */
:root{
  --bg:#0F1322;--bg-deep:#0C0F1C;--card:#141930;--card2:#171C30;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --ink:#EAEDF7;--dim:#9098B6;--faint:#6F7799;--pri:#2B3499;--pri-hi:#6E80F2;--blue:#8E9AF5;
  --ok:#4FD1A5;--ok-bg:rgba(79,209,165,.11);--bad:#FB7185;--bad-bg:rgba(251,113,133,.11);
  --amber:#F2A33C;--amber-bg:rgba(242,163,60,.13);--violet:#A99BF0;--violet-bg:rgba(154,140,224,.13);--blue-bg:rgba(142,154,245,.11);
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--head:Sora,Inter,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:16px/1.6 var(--font);padding:0 14px calc(90px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto}
a{color:var(--pri-hi)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.top{position:sticky;top:0;z-index:6;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ttl{flex:1 1 260px;min-width:0}
.ttl h1{font:700 18px/1.3 var(--head);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl small{display:block;color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd{font-size:13.5px;color:var(--dim);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.cd b{color:var(--amber);font-weight:700}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--dim);border:1px solid var(--line2);background:var(--card);white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tabs kbd{font:11px var(--mono);color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.tabs button.on kbd{color:#c9cff8;border-color:rgba(255,255,255,.25)}
.badge{display:inline-block;min-width:20px;text-align:center;font-size:12px;border-radius:999px;background:var(--amber);color:#1b1305;padding:0 6px;font-weight:700}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--pri-hi);outline-offset:2px}
main{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px}
.card.hl{border-color:rgba(110,128,242,.55)}
h2{font:700 22px/1.3 var(--head);margin:0 0 6px;text-wrap:balance}
h3{font:600 17px/1.35 var(--head);margin:18px 0 6px;color:var(--ink)}
h4{font-size:15px;margin:14px 0 4px}
p{margin:8px 0}
.card ul,.card ol{padding-left:22px;margin:8px 0}
.card li{margin:4px 0}
.lead{color:var(--dim)}
.lead p:first-child{margin-top:4px}
.small{font-size:14px;color:var(--dim)}
.lbl{font-size:12px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font:600 15px var(--font);border-radius:12px;padding:9px 14px;border:1px solid var(--line2);color:var(--ink);background:var(--card2);display:inline-flex;gap:8px;align-items:center;min-height:42px}
.btn:hover{border-color:rgba(255,255,255,.25)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover{background:#3440b0}
.btn.ghost{background:transparent;color:var(--dim)}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.c-ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.c-md{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.c-hi{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.c-lo{background:var(--card2);color:var(--faint)}
.c-pri{background:var(--blue-bg);color:var(--blue);border-color:transparent}
.pts{font-weight:700;color:var(--amber);white-space:nowrap}
mark{background:var(--amber-bg);color:#FFD9A3;border-radius:4px;padding:0 3px}
code{font:14px var(--mono);background:var(--card2);border-radius:5px;padding:1px 5px}
/* content blocks (color = meaning) */
.blk-simple,.blk-remember,.blk-mist,.blk-hook{border-radius:0 12px 12px 0;padding:10px 14px;margin-top:12px;border-left:4px solid}
.blk-simple{background:var(--blue-bg);border-color:var(--blue)}
.blk-remember{background:var(--ok-bg);border-color:var(--ok)}
.blk-mist{background:var(--bad-bg);border-color:var(--bad)}
.blk-hook{background:var(--violet-bg);border-color:var(--violet)}
.blk-ex{background:var(--card2);border-radius:12px;padding:10px 14px;margin-top:10px}
.bh{display:flex;gap:7px;align-items:center;font-weight:700;font-size:13.5px;margin-bottom:2px}
.blk-simple .bh{color:var(--blue)}.blk-remember .bh{color:var(--ok)}.blk-mist .bh{color:var(--bad)}.blk-hook .bh{color:var(--violet)}.blk-ex .bh{color:var(--dim)}
.blk-simple p,.blk-remember p,.blk-mist p,.blk-hook p,.blk-ex p{margin:4px 0}
.ms{background:rgba(110,128,242,.05);border:1.5px dashed rgba(110,128,242,.6);border-radius:12px;padding:12px 16px;margin:12px 0}
.ms>.bh{color:var(--pri-hi)}
.src{font-size:13px;color:var(--dim);margin-top:12px;display:flex;gap:6px;align-items:flex-start}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;position:relative;padding-left:36px;margin:10px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.fxm{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin:10px 0;overflow-x:auto}
.fxm .note{font-size:14px;color:var(--dim);margin:4px 0}
.math{white-space:nowrap}
.mathd{display:block;overflow-x:auto;overflow-y:hidden;padding:4px 0;max-width:100%}
.katex{font-size:1.06em}
.tw{overflow-x:auto;margin:8px 0}
table.t{border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums;min-width:60%}
table.t th,table.t td{border:1px solid var(--line2);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--card2);font-weight:600}
table.t td.n{text-align:right;white-space:nowrap}
table.t tr.sum td{font-weight:700;border-top:2px solid var(--dim)}
.fig{margin:12px 0;background:#F4F6FB;border-radius:12px;padding:10px;overflow-x:auto}
.fig img{display:block;width:100%;max-width:720px;height:auto;margin:0 auto}
.figcap{font-size:13.5px;color:var(--dim);margin-top:-4px;margin-bottom:8px}
details.more{border:1px solid var(--line2);border-radius:12px;padding:8px 14px;margin-top:12px}
details.more>summary{cursor:pointer;font-weight:600;color:var(--pri-hi)}
/* progress */
.track{height:8px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden;min-width:40px}
.track i{display:block;height:100%;background:var(--pri-hi);border-radius:5px}
.stack{display:flex;height:12px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.07)}
.stack i{display:block;height:100%}
.s-ok{background:var(--ok)}.s-learn{background:var(--amber)}.s-new{background:rgba(255,255,255,.12)}
/* lists */
.rk{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) minmax(70px,150px) 44px auto;gap:10px;align-items:center;width:100%;border-top:1px solid var(--line);padding:10px 4px}
.rk:hover{background:rgba(255,255,255,.03)}
.rk .rn{font-weight:700;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.rk .rl b{display:block;font-weight:600;line-height:1.35}
.rk .rl small{display:block;color:var(--dim);font-size:13px}
.rk .rp{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
details.tier{border-top:1px solid var(--line);padding:9px 0}
details.tier>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:56px minmax(0,1fr) minmax(70px,140px) 44px;gap:10px;align-items:center}
details.tier>summary::-webkit-details-marker{display:none}
details.tier .sn{font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}
details.tier .sl b{display:block;font-weight:600;line-height:1.35}
details.tier .sl small{display:block;color:var(--dim);font-size:13px}
details.tier .rp{text-align:right;font-weight:700}
details.tier[open]>summary{margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:5px}
.tile:hover{border-color:rgba(110,128,242,.5)}
.tile.solid{border-left:4px solid var(--ok)}
.tile .tn{font-size:12px;font-weight:700;color:var(--amber);letter-spacing:.04em;text-transform:uppercase}
.tile .tt{font-weight:600;font-size:16px;line-height:1.3}
.tile .tm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.back{all:unset;cursor:pointer;font-weight:600;color:var(--pri-hi);display:inline-flex;gap:6px;align-items:center}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.sp{all:unset;cursor:pointer;padding:7px 12px;border-radius:10px;border:1px solid var(--line2);font-weight:600;font-size:14.5px;background:var(--card2)}
.sp small{font-weight:400;color:var(--dim);margin-left:4px}
.sp.on{background:var(--pri);border-color:var(--pri);color:#fff}.sp.on small{color:#c9cff8}
.grp{margin:16px 0 4px}
/* overview */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 22px;align-items:center}
.big{font:700 46px/1 var(--head);font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--dim);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
/* tasks */
.task{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:12px 16px}
.inp{display:grid;grid-template-columns:minmax(0,1fr) 150px 26px;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0}
.inp input,.inp select{font:16px var(--font);padding:8px 10px;border:1px solid var(--line2);border-radius:10px;width:100%;background:var(--bg-deep);color:var(--ink);font-variant-numeric:tabular-nums}
.inp .unit{font-size:13px;color:var(--dim)}
.inp .mk{display:grid;place-items:center}
.inp.ok input,.inp.ok select{border-color:var(--ok);background:var(--ok-bg)}
.inp.bad input,.inp.bad select{border-color:var(--bad);background:var(--bad-bg)}
.inp.ok .mk{color:var(--ok)}.inp.bad .mk{color:var(--bad)}
textarea{width:100%;min-height:140px;font:16px/1.5 var(--font);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--bg-deep);color:var(--ink);resize:vertical}
.chk{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 0;border-top:1px dashed var(--line2)}
.chk input{width:18px;height:18px;accent-color:var(--ok);margin-top:3px}
.chk p{margin:0}
.mc{margin-top:12px}
.mc>b{display:block;margin-bottom:4px}
.mc label{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.mc label:hover{background:rgba(255,255,255,.03)}
.mc label.right{background:var(--ok-bg);border-color:rgba(79,209,165,.4)}
.mc label.wrong{background:var(--bad-bg);border-color:rgba(251,113,133,.4)}
.mc input{margin-top:5px;accent-color:var(--pri-hi)}
.mc .ex{font-size:14.5px;color:var(--dim);margin:4px 0 0 30px}
.score{font:700 34px/1 var(--head);font-variant-numeric:tabular-nums}
.score small{font-size:16px;color:var(--dim);font-weight:600}
/* flashcards */
.fc{min-height:260px;display:flex;flex-direction:column;gap:10px}
.fc .q{font-size:20px;font-weight:600;line-height:1.4}
.fc .a{border-top:1px solid var(--line2);padding-top:10px}
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.rb{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;border-radius:12px;padding:9px 4px;font-weight:700;border:1.5px solid;font-size:15px;background:var(--card2)}
.rb small{display:block;font-weight:500;font-size:12px;opacity:.85}
.rb.g0{border-color:var(--bad);color:var(--bad)}.rb.g1{border-color:var(--amber);color:var(--amber)}.rb.g2{border-color:var(--ok);color:var(--ok)}.rb.g3{border-color:var(--pri-hi);color:var(--pri-hi)}
.kbd{font-size:12.5px;color:var(--faint);text-align:center}
.deckrow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.go{all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--pri-hi);white-space:nowrap}
/* mock */
.simbar{position:sticky;top:var(--top-h,112px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:8px 0;flex-wrap:wrap}
.timer{font:700 24px var(--head);color:var(--amber);font-variant-numeric:tabular-nums}
.mq .qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.mq .qh b{font-size:17px}
/* cheat sheet */
.cheat{columns:2 320px;column-gap:12px}
.cheat .cs{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.cheat .cs h4{margin:0 0 4px;color:var(--pri-hi);font-family:var(--head)}
.cheat .fxm{padding:2px 10px}
/* misc */
.banner{background:var(--amber-bg);border:1px solid rgba(242,163,60,.4);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);color:var(--ink);padding:9px 16px;border-radius:12px;font-weight:600;font-size:14.5px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;background:rgba(5,7,15,.72);z-index:30;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.modal textarea{min-height:220px;font:13px/1.45 var(--mono)}
.empty{color:var(--dim);text-align:center;padding:26px 10px}
@media (max-width:640px){
  body{font-size:15.5px;padding:0 10px calc(90px + env(safe-area-inset-bottom,0px))}
  .card{padding:15px 14px}
  h2{font-size:20px}
  .tabs kbd,.kbdhint{display:none}
  .rk{grid-template-columns:24px minmax(0,1fr) 44px}.rk .rb2,.rk .chip{display:none}
  details.tier>summary{grid-template-columns:48px minmax(0,1fr) 40px}details.tier .sb{display:none}
  .inp{grid-template-columns:minmax(0,1fr) 116px 22px;gap:8px}
  .deckrow{grid-template-columns:minmax(0,1fr) 80px auto}
  .big{font-size:40px}
  .hero{grid-template-columns:1fr}
  .ttl h1{white-space:normal}
  .fc .q{font-size:18px}
  .rb{font-size:14px}
}
</style>
</head>

  <header class="top" id="top">

  <main id="main"></main>

<div class="toast" id="toast" hidden></div>

"effort":"niedrig","sources":"Folien 14–15"},{"id":"agency","title":"Agency conflicts managers vs shareholders","slotIds":["q5"],"expectedPoints":10,"tier":2,"why":"Wahlaufgabe","effort":"mittel","pairWith":"ethics","sources":"Folien 86–89"},{"id":"ethics","title":"CFA ethics case","slotIds":["q6"],"expectedPoints":10,"tier":2,"why":"Wahlaufgabe, Gastvortrag","effort":"niedrig","sources":"Gastvortrag"},{"id":"ratings","title":"Credit rating agencies","slotIds":["q3"],"expectedPoints":6,"tier":3,"why":"4 von 5, wenige Punkte","effort":"niedrig","sources":"Folien 37–45"}],"notation":"WACC, k_E, k_D, D/E; Beträge in Mio. (m).","sources":[{"file":"Julius Finance/Corporate Finance FT23 2.pdf","kind":"altklausur","pages":3}],"updatedAt":"2026-11-14"},"topics":{"dcf":{"schema":"lernly.thema/1","id":"dcf","theory":[{"type":"simple","md":"A firm is worth all the money it will give in the future. But €1 later is worth less than €1 today. So we pull every future cash flow back to today (we **discount** it) and add them up. That sum is the value of the **whole firm**. The firm belongs to lenders and owners: take away what belongs to the lenders (debt) and the rest belongs to the owners (equity)."},{"type":"example","md":"A lemonade stand pays you €10 every year, forever. You could earn 10% elsewhere. Value today = 10 / 0.10 = **€100**. If it grows 2% a year: 10 / (0.10 − 0.02) = **€125**."},{"type":"figure","svg":"<svg viewBox=\"0 0 680 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><defs><marker id=\"a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2B3499\"/><\/marker><\/defs><line x1=\"60\" y1=\"40\" x2=\"640\" y2=\"40\" stroke=\"#C9D4DF\" stroke-width=\"2\"/><text x=\"110\" y=\"26\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1D2733\">t = 0<\/text><text x=\"260\" y=\"26\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1D2733\">t = 1<\/text><text x=\"410\" y=\"26\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1D2733\">t = 2<\/text><text x=\"560\" y=\"26\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1D2733\">t = 3<\/text><rect x=\"45\" y=\"138\" width=\"130\" height=\"58\" rx=\"8\" fill=\"#E4E7FB\" stroke=\"#2B3499\"/><text x=\"110\" y=\"162\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1D2733\">Firm value<\/text><text x=\"110\" y=\"180\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5E6B7B\">= sum of PVs<\/text><rect x=\"205\" y=\"55\" width=\"110\" height=\"44\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#2B3499\"/><text x=\"260\" y=\"74\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1D2733\">CF1<\/text><text x=\"260\" y=\"91\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5E6B7B\">10.0m<\/text><rect x=\"355\" y=\"55\" width=\"110\" height=\"44\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#2B3499\"/><text x=\"410\" y=\"74\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1D2733\">CF2<\/text><text x=\"410\" y=\"91\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5E6B7B\">10.0m<\/text><rect x=\"505\" y=\"55\" width=\"110\" height=\"44\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#2B3499\"/><text x=\"560\" y=\"74\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1D2733\">CF3<\/text><text x=\"560\" y=\"91\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5E6B7B\">10.0m<\/text><rect x=\"495\" y=\"138\" width=\"150\" height=\"58\" rx=\"8\" fill=\"#FDEFD9\" stroke=\"#B5651D\"/><text x=\"570\" y=\"162\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1D2733\">TV3 = CF4/(k−g)<\/text><text x=\"570\" y=\"180\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5E6B7B\">11/(8%−1%) = 157.1m<\/text><line x1=\"205\" y1=\"90\" x2=\"178\" y2=\"146\" stroke=\"#2B3499\" stroke-width=\"1.6\" marker-end=\"url(#a)\"/><line x1=\"355\" y1=\"92\" x2=\"178\" y2=\"158\" stroke=\"#2B3499\" stroke-width=\"1.6\" marker-end=\"url(#a)\"/><line x1=\"505\" y1=\"94\" x2=\"178\" y2=\"166\" stroke=\"#2B3499\" stroke-width=\"1.6\" marker-end=\"url(#a)\"/><line x1=\"495\" y1=\"170\" x2=\"178\" y2=\"172\" stroke=\"#2B3499\" stroke-width=\"1.6\" marker-end=\"url(#a)\"/><\/svg>","caption":"Every arrow = divide by \\((1+\\text{WACC})^t\\). The terminal value sits at t = 3, so it is discounted 3 times, not 4."},{"type":"steps","title":"The 6-step recipe (always the same)","items":["**Write the formulas first.** Old solutions give points for stating them.","**Cash flows for years 1–3.** Start with year 1, not year 0. With \\(CF_0\\) and growth \\(g\\): \\(CF_1=CF_0\\cdot(1+g)\\), \\(CF_2=CF_1\\cdot(1+g)\\), …","**Terminal value at t = 3:** \\(TV_3=\\frac{CF_4}{\\text{WACC}-g}\\) with \\(CF_4=CF_3\\cdot(1+g)\\). No growth: \\(TV_3=\\frac{CF}{\\text{WACC}}\\).","**Discount** every CF and the TV with \\((1+\\text{WACC})^t\\) and add them up = firm value. Add non-operating assets if given.","**Equity = firm value − MARKET value of debt** (never the book value).","**Compare and decide:** equity value vs market cap (or value per share vs share price). Higher → undervalued → **buy**. Lower → overvalued → **sell**."]},{"type":"formula","tex":["PV(CF_t)=\\frac{CF_t}{(1+\\text{WACC})^t}","TV_3=\\frac{CF_4}{\\text{WACC}-g}\\qquad\\text{(no growth: }TV_3=\\tfrac{CF}{\\text{WACC}}\\text{)}","\\text{Firm value}=\\sum_{t=1}^{3}\\frac{CF_t}{(1+\\text{WACC})^t}+\\frac{TV_3}{(1+\\text{WACC})^3}","\\text{Equity}=\\text{Firm value}-\\text{market value of debt}","\\text{Value per share}=\\frac{\\text{Equity}}{\\text{number of shares}}"]},{"type":"heading","text":"Worked example: old exam 2023 (15 points)"},{"type":"text","md":"Market cap 80m, 12m shares, book debt 45m, **market debt 50m**, CF 10m for 3 years, then 11m growing 1%, WACC 8%."},{"type":"table","head":["Step","Calculation","Result"],"rows":[["PV year 1","\\(\\frac{10}{1.08}\\)","9.259m"],["PV year 2","\\(\\frac{10}{1.08^2}\\)","8.573m"],["PV year 3","\\(\\frac{10}{1.08^3}\\)","7.938m"],["TV at t = 3","\\(\\frac{11}{0.08-0.01}\\)","157.143m"],["PV of TV","\\(\\frac{157.143}{1.08^3}\\)","124.745m"],["Firm value","sum","150.516m"],["Equity","\\(150.516-50\\) (market value!)","100.516m"],["Per share","\\(\\frac{100.516}{12}\\)","8.38 €"],["Decision","100.5m > 80m market cap","undervalued → **buy**"]],"sumRows":[5,8]},{"type":"more","title":"Variants that appeared in old exams","md":"- **Growth from \\(CF_0\\):** \\(CF_0=300\\)m, +1% for 3 years, then +0.5% → \\(CF_1=303\\), \\(CF_4=310.64\\), \\(TV_3=5{,}647.9\\) → equity 4,559.8m → 45.60 € per share → buy at 40.\n- **Flat CF, then a new flat level:** 6m for 3 years, then 6.5m forever, WACC 7% → \\(TV_3=\\frac{6.5}{0.07}=92.86\\) → equity 59.55m > 50m → buy.\n- **Revenue multiple:** \"peer firm value = 3.5 × sales\" → our firm value \\(=3.5\\times24\\text{m}=84\\text{m}\\). Just multiply."}],"standardAnswer":[{"type":"model_answer","md":"Since we value the firm with the ==entity method==, we discount the ==free cash flows to the firm== with the ==WACC== of 8%. The ==terminal value== at the end of year 3 is \\(TV_3=\\frac{CF_4}{\\text{WACC}-g}=\\frac{11}{0.08-0.01}=157.14\\text{m}\\), discounted to today 124.75m.\n\n\\(\\text{Firm value}=9.26+8.57+7.94+124.75=150.52\\text{m}\\). The ==value of equity== is the firm value minus the ==market value of debt==: \\(150.52-50=100.52\\text{m}\\).\n\nThe ==intrinsic value== of equity (100.52m, 8.38 € per share) is higher than the ==market capitalisation== (80m, 6.67 € per share). The share is ==undervalued==, so I recommend to ==buy==."}],"tasks":[{"kind":"drill","id":"dcf-ex23","name":"DCF → equity value → buy or sell","origin":"altklausur","originLabel":"Old exam 2023, Q2 (15 P)","variants":[{"text":"Market capitalisation 80m, 12m shares outstanding. Book value of debt 45m, **market value of debt 50m**. Free cash flows: 10m in each of the next 3 years, then 11m growing at 1% forever. WACC 8%.\n\nCalculate the firm value, the equity value and the value per share. Should you buy or sell the share?","fields":[{"label":"Firm value","answer":150.52,"rel":0.005,"unit":"m"},{"label":"Equity value","answer":100.52,"rel":0.005,"unit":"m"},{"label":"Value per share","answer":8.38,"tol":0.02,"unit":"€"}],"choice":{"label":"Decision","options":["buy","sell"],"answer":"buy"},"solution":[{"type":"table","head":["Step","Calculation","Result"],"rows":[["PV year 1","\\(\\frac{10}{1.08}\\)","9.259m"],["PV year 2","\\(\\frac{10}{1.08^2}\\)","8.573m"],["PV year 3","\\(\\frac{10}{1.08^3}\\)","7.938m"],["TV at t = 3","\\(\\frac{11}{0.08-0.01}\\)","157.143m"],["PV of TV","\\(\\frac{157.143}{1.08^3}\\)","124.745m"],["Firm value","sum","150.516m"],["Equity","\\(150.516-50\\) (market value!)","100.516m"],["Per share","\\(\\frac{100.516}{12}\\)","8.38 €"],["Decision","100.5m > 80m market cap","undervalued → **buy**"]],"sumRows":[5,8]},{"type":"remember","md":"Subtract the **market** value of debt (50m), never the book value (45m)."}]}]},{"kind":"drill","id":"dcf-growth","name":"DCF with growth from \\(CF_0\\)","origin":"neu","hint":"new numbers every time","variants":[{"text":"Last year's free cash flow was \\(CF_0=300\\)m. It grows by 1% per year for the next 3 years, then by 0.5% forever. WACC 6%, market value of debt 1000m, 100m shares, share price 40 €.\n\nCalculate the firm value, the equity value and the value per share. Buy or sell?","fields":[{"label":"Firm value","answer":5559.84,"rel":0.005,"unit":"m"},{"label":"Equity value","answer":4559.84,"rel":0.005,"unit":"m"},{"label":"Value per share","answer":45.6,"rel":0.005,"unit":"€"}],"choice":{"label":"Decision","options":["buy","sell"],"answer":"buy"},"solution":[{"type":"steps","items":["Cash flows from year 1: \\(CF_1=300\\cdot1.01=303.00\\), \\(CF_2=306.03\\), \\(CF_3=309.09\\).","\\(CF_4=CF_3\\cdot1.005=310.64\\) and \\(TV_3=\\frac{310.64}{0.06-0.005}=5647.92\\).","Present values: 285.85 + 272.37 + 259.52 + \\(\\frac{5647.92}{1.06^3}=4742.10\\) → firm value **5559.84m**.","Equity = 5559.84 − 1000 = **4559.84m**, per share 4559.84 / 100 = **45.60 €**.","45.60 € > 40 € → share is undervalued → **buy**."]}]},{"text":"Last year's free cash flow was \\(CF_0=120\\)m. It grows by 2% per year for the next 3 years, then by 1% forever. WACC 7%, market value of debt 400m, 50m shares, share price 20 €.\n\nCalculate the firm value, the equity value and the value per share. Buy or sell?","fields":[{"label":"Firm value","answer":2077.24,"rel":0.005,"unit":"m"},{"label":"Equity value","answer":1677.24,"rel":0.005,"unit":"m"},{"label":"Value per share","answer":33.54,"rel":0.005,"unit":"€"}],"choice":{"label":"Decision","options":["buy","sell"],"answer":"buy"},"solution":[{"type":"steps","items":["Cash flows from year 1: \\(CF_1=120\\cdot1.02=122.40\\), \\(CF_2=124.85\\), \\(CF_3=127.34\\).","\\(CF_4=CF_3\\cdot1.01=128.62\\) and \\(TV_3=\\frac{128.62}{0.07-0.01}=2143.64\\).","Present values: 114.39 + 109.05 + 103.95 + \\(\\frac{2143.64}{1.07^3}=1749.85\\) → firm value **2077.24m**.","Equity = 2077.24 − 400 = **1677.24m**, per share 1677.24 / 50 = **33.54 €**.","33.54 € > 20 € → share is undervalued → **buy**."]}]},{"text":"Last year's free cash flow was \\(CF_0=80\\)m. It grows by 3% per year for the next 3 years, then by 1.5% forever. WACC 9%, market value of debt 250m, 20m shares, share price 50 €.\n\nCalculate the firm value, the equity value and the value per share. Buy or sell?","fields":[{"label":"Firm value","answer":1128.07,"rel":0.005,"unit":"m"},{"label":"Equity value","answer":878.07,"rel":0.005,"unit":"m"},{"label":"Value per share","answer":43.9,"rel":0.005,"unit":"€"}],"choice":{"label":"Decision","options":["buy","sell"],"answer":"sell"},"solution":[{"type":"steps","items":["Cash flows from year 1: \\(CF_1=80\\cdot1.03=82.40\\), \\(CF_2=84.87\\), \\(CF_3=87.42\\).","\\(CF_4=CF_3\\cdot1.015=88.73\\) and \\(TV_3=\\frac{88.73}{0.09-0.015}=1183.06\\).","Present values: 75.60 + 71.44 + 67.50 + \\(\\frac{1183.06}{1.09^3}=913.54\\) → firm value **1128.07m**.","Equity = 1128.07 − 250 = **878.07m**, per share 878.07 / 20 = **43.90 €**.","43.90 € < 50 € → share is overvalued → **sell**."]}]}]},{"kind":"essay","id":"dcf-explain","name":"Explain the entity method","origin":"probeklausur","originLabel":"Sample question 2","points":6,"question":"Explain how a firm is valued with the **entity method** (DCF) and how you get from the firm value to a buy or sell recommendation.","checklist":[{"text":"Discount **free cash flows to the firm** with the **WACC**","points":1},{"text":"Explicit forecast period plus a **terminal value** \\(TV=\\frac{CF_{T+1}}{\\text{WACC}-g}\\)","points":1},{"text":"Sum of present values = **firm (entity) value**","points":1},{"text":"Equity = firm value − **market value** of debt","points":1},{"text":"Compare equity value (or value per share) with market cap (or share price)","points":1},{"text":"Conclusion: higher → **undervalued → buy**, lower → overvalued → sell","points":1}],"modelAnswer":[{"type":"text","md":"With the ==entity method== we discount the ==free cash flows to the firm== with the ==WACC==. We forecast the cash flows explicitly for a few years and capture everything after that with a ==terminal value==, \\(TV_T=\\frac{CF_{T+1}}{\\text{WACC}-g}\\).\n\nThe sum of all present values is the ==firm value==. Subtracting the ==market value of debt== gives the ==equity value==. If the equity value (or value per share) is higher than the market capitalisation (or share price), the share is ==undervalued== and I recommend to buy it; otherwise sell."}]},{"kind":"mc","id":"dcf-traps","name":"Quick check: the classic DCF traps","origin":"neu","questions":[{"q":"Cash flows are given for years 1–3. With how many periods do you discount \\(TV_3\\)?","options":["2","3","4"],"answer":1,"explain":"\\(TV_3\\) sits at the end of year 3, so it is discounted with \\((1+\\text{WACC})^3\\). Using 4 is the most common mistake."},{"q":"Which debt value do you subtract from the firm value?","options":["Book value of debt","Market value of debt","Face value of the next bond"],"answer":1,"explain":"Equity is what remains after paying lenders at today's value, so you use the **market** value."},{"q":"Value per share is …","options":["firm value / shares","equity value / shares","market cap / shares"],"answer":1,"explain":"Shares are claims on equity, not on the whole firm."}]}],"cards":[{"id":"dcf-c1","front":"Terminal value at t = 3 (with growth)","back":"\\(TV_3=\\frac{CF_4}{\\text{WACC}-g}\\) with \\(CF_4=CF_3\\cdot(1+g)\\). Discount with \\((1+\\text{WACC})^3\\)."},{"id":"dcf-c2","front":"From firm value to equity value","back":"Equity = firm value − **market** value of debt (not book value)."},{"id":"dcf-c3","front":"Buy or sell? (DCF)","back":"Equity value > market cap (or value per share > price) → undervalued → **buy**. Otherwise sell."},{"id":"dcf-c4","front":"Entity method: which cash flows, which rate?","back":"Free cash flows **to the firm**, discounted with the **WACC**."}],"mistakes":["Using the **book** value of debt.","Starting with \\(CF_0\\) instead of \\(CF_1\\).","Discounting the TV with \\(1.08^4\\) instead of \\(1.08^3\\).","Growth TV with \\(CF_3\\) instead of \\(CF_4=CF_3\\cdot(1+g)\\).","Dividing the **firm** value by the number of shares (must be equity).","Forgetting the buy/sell sentence (easy points)."],"hook":"**CF – TV – PV – minus D – compare**: cash flows (from year 1) → terminal value → present values → minus debt (market!) → compare with the price.","source":"Lecture slides 46–64 (steps on slide 51), Addendum II, old exams 2015, 2020, 2021, 2023."},"emh":{"schema":"lernly.thema/1","id":"emh","theory":[{"type":"simple","md":"A market is **efficient** if prices already contain the available information. Then you cannot beat the market with that information, because it is already in the price."},{"type":"table","head":["Form","Information already in the price","What does not work any more"],"rows":[["Weak","Past prices and volumes","Technical analysis (charts)"],["Semi-strong","+ all **public** information","Fundamental analysis"],["Strong","+ private / insider information","Even insider trading"]]},{"type":"remember","md":"Strong ⊃ semi-strong ⊃ weak. Each form includes the one below."}],"standardAnswer":[{"type":"model_answer","md":"The ==efficient market hypothesis== says that prices reflect all available information. In the ==weak form== prices contain all past prices, so ==technical analysis== cannot earn excess returns. In the ==semi-strong form== prices also contain all public information, so ==fundamental analysis== does not help. In the ==strong form== even private information is priced in, so not even insiders can earn abnormal returns."}],"tasks":[{"kind":"essay","id":"emh-strong","name":"Explain the strong form and test it","origin":"altklausur","originLabel":"Old exam 2021, Q1 (10 P)","points":10,"question":"Explain the three forms of market efficiency. How could you test the **strong form**?","checklist":[{"text":"Definition: prices reflect all available information","points":2},{"text":"Weak form: past prices → no technical analysis","points":2},{"text":"Semi-strong: + public information → no fundamental analysis","points":2},{"text":"Strong: + private information → no insider profits","points":2},{"text":"Test: do insiders / fund managers earn abnormal returns?","points":2}],"modelAnswer":[{"type":"text","md":"See the standard answer above. **Test of the strong form:** check whether insiders or professional fund managers earn ==abnormal returns==. If they do, the strong form is rejected."}]}],"cards":[{"id":"emh-c1","front":"Three forms of market efficiency","back":"- **Weak:** past prices\n- **Semi-strong:** + public info\n- **Strong:** + private info"}],"mistakes":["Mixing up semi-strong (public) and strong (private)."],"source":"Lecture slides 14–15."},"mm":{"schema":"lernly.thema/1","id":"mm","theory":[{"type":"simple","md":"Der **Financial Leverage Effect** zeigt: Solange das eingesetzte Fremdkapital weniger Zinsen kostet (\\(i\\)), als die Assets verdienen (\\(\\text{RoA}\\)), hebelt Verschuldung die Eigenkapitalrendite (\\(\\text{RoE}\\)) nach oben — gleichzeitig steigt aber das Risiko für die Aktionäre (\\(k_E\\) wächst linear mit \\(D/E\\))."},{"type":"formula","tex":["\\text{RoE} = \\frac{\\text{Profit} - \\text{Cost of Debt}}{\\text{Equity}} = \\text{RoA} + \\frac{D}{E}(\\text{RoA} - i)","k_E = k_U + \\frac{D}{E}(k_U - k_D)","V_L = V_U + PV(\\text{Tax Shield}) - PV(\\text{Financial Distress})"],"note":"Im MM-Grundmodell ohne Steuern kompensiert das steigende k_E den billigeren Zins k_D exakt → WACC bleibt konstant."},{"type":"table","head":["MM-Annahme (perfekter Markt)","Abweichung in der Realität","Folge für die Kapitalstruktur"],"rows":[["Keine Unternehmenssteuern","Fremdkapitalzinsen mindern Steuerlast","**Tax Shield** (\\(V_L = V_U + t\\cdot D\\)) erhöht Unternehmenswert"],["Keine Insolvenzkosten","Direkte & indirekte Distress Costs steigen mit \\(D/E\\)","Begrenzt Verschuldung → **Trade-off Optimum D\\***"],["Konstante Investitionspolitik","Agency Costs of Equity vs. Agency Costs of Debt","Debt diszipliniert Manager, verursacht aber Risikoanreize"],["Symmetrische Information","Manager wissen mehr als Investoren","**Pecking Order**: Innenfinanzierung → Fremdkapital → Eigenkapital"]]},{"type":"remember","md":"Das Optimum **\\(D^*\\)** liegt exakt dort, wo der Grenznutzen des letzten Euros Schulden (**Tax Shield** bzw. geringere Equity-Agency-Kosten) den Grenzkosten (**Financial Distress** bzw. steigende Debt-Agency-Kosten) entspricht."}],"standardAnswer":[{"type":"model_answer","title":"Klausurfertige Antwort (Leverage, MM & Optimum)","md":"Der ==leverage effect== erhöht die Eigenkapitalrendite \\(\\text{RoE} = \\text{RoA} + \\frac{D}{E}(\\text{RoA}-i)\\), solange \\(\\text{RoA} > i\\); fällt \\(\\text{RoA} < i\\), kehrt sich der Hebel negativ um. Deshalb steigen mit der Verschuldung nicht nur erwartete Rendite, sondern auch Volatilität und Risiko.\n\nNach Modigliani–Miller (1958) ist die Kapitalstruktur im perfekten Markt irrelevant, weil Anleger über ==homemade leverage== jeden Verschuldungsgrad selbst nachbauen können und der WACC konstant bleibt (\\(k_E = k_U + \\frac{D}{E}(k_U - k_D)\\)).\n\nHebt man perfekte Annahmen auf, schafft das ==tax shield== Wert (\\(V_L = V_U + t\\cdot D\\)), während ==costs of financial distress== (direkte Verfahrenskosten und indirekte Geschäftsverluste) sowie steigende ==agency costs of debt== gegenüber sinkenden ==agency costs of equity== den Verschuldungsgrad begrenzen. Die optimale Kapitalstruktur \\(D^*\\) maximiert den Unternehmenswert dort, wo Grenznutzen gleich Grenzkosten sind."}],"tasks":[{"kind":"drill","id":"mm-leverage-drill","name":"Leverage-Effekt & MM Proposition II berechnen","origin":"altklausur","originLabel":"Folie 69 & FT20 Q4","hint":"Rechne Zins = Debt × i und danach RoE = (Profit − Zins) / Equity","variants":[{"text":"Unternehmen mit Assets 8.000m, davon **4.000m Equity** und **4.000m Debt** zu \\(i = 10\\,\\%\\) (Folie 69). Berechne die **RoE in %** für drei Szenarien:\n- Normal: RoA = 15 %\n- Rezession: RoA = 5 %\n- Expansion: RoA = 25 %","fields":[{"label":"RoE Normal (RoA 15 %)","answer":20,"tol":0.05,"unit":"%"},{"label":"RoE Rezession (RoA 5 %)","answer":0,"tol":0.05,"unit":"%"},{"label":"RoE Expansion (RoA 25 %)","answer":40,"tol":0.05,"unit":"%"}],"solution":[{"type":"steps","items":["Zinsaufwand in allen Szenarien: \\(4.000 \\times 10\\,\\% = 400\\text{m}\\).","Normal (RoA 15 %): Profit \\(1.200 - 400 = 800\\) → \\(\\text{RoE} = \\frac{800}{4.000} = \\mathbf{20\\,\\%}\\).","Rezession (RoA 5 %): Profit \\(400 - 400 = 0\\) → \\(\\text{RoE} = \\mathbf{0\\,\\%}\\) (negativer Hebel gegen 5 % RoA!).","Expansion (RoA 25 %): Profit \\(2.000 - 400 = 1.600\\) → \\(\\text{RoE} = \\frac{1.600}{4.000} = \\mathbf{40\\,\\%}\\)."]}]},{"text":"MM ohne Steuern (Proposition II): Unverschuldete Kapitalkosten \\(k_U = 12\\,\\%\\), Fremdkapitalkosten \\(k_D = 6\\,\\%\\), Verschuldungsgrad \\(D/E = 1{,}0\\) (also 50 % Debt, 50 % Equity).\n\nBerechne die neuen Eigenkapitalkosten \\(k_E\\) und den WACC in Prozent.","fields":[{"label":"Eigenkapitalkosten k_E","answer":18,"tol":0.05,"unit":"%"},{"label":"WACC","answer":12,"tol":0.05,"unit":"%"}],"solution":[{"type":"steps","items":["Proposition II: \\(k_E = k_U + \\frac{D}{E}(k_U - k_D) = 12\\,\\% + 1{,}0 \\times (12\\,\\% - 6\\,\\%) = \\mathbf{18\\,\\%}\\).","\\(\\text{WACC} = 0{,}5 \\times 18\\,\\% + 0{,}5 \\times 6\\,\\% = 9\\,\\% + 3\\,\\% = \\mathbf{12\\,\\%} = k_U\\) (konstant!)."]}]}]},{"kind":"essay","id":"mm-optimal-cs","name":"a) Financial Leverage Effect & b) Optimal Capital Structure (Trade-off & Agency)","origin":"altklausur","originLabel":"Old exam 2023, Q4 (19 P)","points":19,"question":"a) Explain the **financial leverage effect**.\nb) Modigliani and Miller propose that capital structure policy is irrelevant under various assumptions. Derive an **optimal capital structure** under corporate taxes and bankruptcy costs OR based on principal-agency costs.","checklist":[{"text":"Leverage-Effekt: Formel \\(\\text{RoE}=\\text{RoA}+\\frac{D}{E}(\\text{RoA}-i)\\) + Vorzeichen bei \\(\\text{RoA}>i\\) vs. \\(i>\\text{RoA}\\)","points":3},{"text":"Vorlesungsbeispiel (Assets 8.000, Debt 4.000 @ 10 % → RoE 0 / 20 / 40 %) + Risikoanstieg","points":3},{"text":"MM (1958): Kapitalstruktur irrelevant im perfekten Markt (Homemade Leverage, Proposition II)","points":3},{"text":"Steuern (Tax Shield \\(V_L = V_U + t\\cdot D\\)) + direkte & indirekte Distress Costs","points":3},{"text":"Trade-off Optimum \\(D^*\\) (\\(V = V_U + PV(\\text{TS}) - PV(\\text{Distress})\\)): Grenznutzen = Grenzkosten (+ Skizze)","points":4},{"text":"Agency-Herleitung: Equity Agency Costs sinken durch Debt vs. Debt Agency Costs steigen → Minimum = Optimum","points":3}],"modelAnswer":[{"type":"text","md":"**a) Leverage effect:** As long as \\(\\text{RoA} > i\\), replacing equity with debt boosts \\(\\text{RoE} = (\\text{Profit} - \\text{Cost of Debt}) / \\text{Equity}\\). In the lecture example (8,000 assets, 4,000 debt at 10 %), expected RoE rises from 15 % to 20 %, but swings between 0 % (RoA 5 %) and 40 % (RoA 25 %), raising shareholder risk.\n\n**b) Optimal capital structure:** Under MM's perfect-market assumptions (Proposition I & II), homemade leverage keeps WACC constant. With corporate taxes, debt generates a valuable ==tax shield== (\\(V_L = V_U + t\\cdot D\\)), but higher leverage raises direct and indirect ==costs of financial distress==. Value peaks at \\(D^*\\) where marginal tax benefit equals marginal expected distress cost. In the agency-cost framework, debt cuts ==agency costs of equity== (free cash flow discipline) while increasing ==agency costs of debt== (asset substitution, debt overhang), minimizing total agency costs at the interior optimum."}]},{"kind":"mc","id":"mm-mc","name":"Quick check: MM & Trade-off Theory","origin":"altklausur","questions":[{"q":"Unter MM ohne Steuern: Was passiert mit dem WACC, wenn ein Unternehmen mehr günstiges Fremdkapital aufnimmt?","options":["WACC sinkt linear mit steigendem Verschuldungsgrad","WACC bleibt konstant, weil k_E genau passend ansteigt","WACC steigt, weil Schulden immer teurer als Eigenkapital sind"],"answer":1,"explain":"Nach MM Proposition II gleicht das höhere Risiko für Aktionäre (steigendes k_E) den Zinsvorteil exakt aus."},{"q":"Wann wirkt der Financial Leverage Effect negativ auf die Eigenkapitalrendite (RoE)?","options":["Wenn der Fremdkapitalzins i größer als die Gesamtkapitalrendite RoA ist","Wenn die Aktie unterbewertet ist","Immer bei Unternehmen mit positiven Steuersätzen"],"answer":0,"explain":"Bei i > RoA kostet jeder geliehene Euro mehr Zinsen, als er erwirtschaftet — RoE fällt unter RoA."},{"q":"Welche beiden Gegenspieler bestimmen das Optimum D* in der Trade-off Theory?","options":["Dividendenrendite vs. Transaktionskosten","Barwert des Tax Shield vs. Barwert der Costs of Financial Distress","Buchwert FK vs. Nennwert Aktien"],"answer":1,"explain":"V = V_U + PV(Tax Shield) − PV(Financial Distress) — Maximum bei Grenznutzen = Grenzkosten."}]}],"cards":[{"id":"mm-c1","front":"Wann ist der Leverage-Effekt positiv, wann negativ?","back":"Positiv solange **RoA > i** (Fremdkapitalzins); negativ sobald **i > RoA**."},{"id":"mm-c2","front":"MM Proposition II (ohne Steuern)","back":"\\(k_E = k_U + \\frac{D}{E}(k_U - k_D)\\). Trotz billigerem Debt steigt \\(k_E\\), sodass der WACC konstant bleibt."},{"id":"mm-c3","front":"Trade-off Theory: Formel & Optimum D*","back":"\\(V = V_U + PV(\\text{Tax Shield}) - PV(\\text{Distress})\\). Optimum \\(D^*\\), wo Grenznutzen = Grenzkosten."},{"id":"mm-c4","front":"Pecking-Order-Reihenfolge bei Informationsasymmetrie (Myers/Majluf)","back":"1. Innenfinanzierung → 2. Fremdkapital → 3. Neues Eigenkapital (nur als letztes Mittel)."}],"mistakes":["Behaupten, günstiges Fremdkapital senke im MM-Grundmodell ohne Steuern den WACC.","Die indirekten Insolvenzkosten (Verlust von Kunden, Lieferanten, Mitarbeitern vor Insolvenz) weglassen.","In der Trade-off-Skizze die Kurve nicht bei \\(D^*\\) gipfeln lassen oder die Achsen (\\(D\\), \\(V\\)) nicht beschriften."],"hook":"**Erst perfekte MM-Welt, dann Tax Shield hoch, Distress/Agency runter → Optimum D***.","source":"Folien 67–92, Altklausuren 2015–2023 Q4."},"agency":{"schema":"lernly.thema/1","id":"agency","theory":[{"type":"simple","md":"**Principal-Agent-Konflikte** entstehen zwischen **Aktionären (Principal)** und **Management (Agent)**, weil das Management Entscheidungen unter **asymmetrischer Information** trifft (Hidden Action / Moral Hazard) und eigene Ziele verfolgt."},{"type":"steps","title":"Die 4 Eigenkapital-Agency-Probleme (Folie 87)","items":["**Effort provision problem:** Shirking (weniger Einsatz), schlechte Entscheidungen, On-the-job Consumption (Perquisites).","**Risk preference problem:** Manager haben ihr Humankapital undiversifiziert an eine Firma gebunden → bevorzugen zu risikoarme Projekte / zu viel Diversifikation.","**Time preference problem:** Kurzfrist-Orientierung bis zum nächsten Bonus / Vertragsende statt langfristiger Wertschaffung.","**Overinvestment problem (Free Cash Flow):** Management behält freie Cashflows ein und baut ein Imperium (**Empire Building**) auch mit negativem NPV."]},{"type":"table","head":["Kontrollmechanismus (Folie 89)","Wann wirkt er?","Wie diszipliniert er das Management?"],"rows":[["**Kapitalstruktur (mehr Debt)**","Ex ante","Feste Zins- und Tilgungszahlungen saugen freien Cashflow ab; höheres Insolvenzrisiko erhöht Leistungsdruck"],["**Board / Aufsichtsrat & Blockbesitzer**","Ex ante","Direktes Monitoring durch kompetente Aufseher und Großaktionäre mit echtem Anreiz"],["**Anreizkompatible Vergütung**","Ex ante","Aktienpakete, langfristige Optionen, EVA-Boni mit Vesting & Clawbacks"],["**Managerarbeitsmarkt & Übernahmemarkt**","Ex post","Schlechte Leistung senkt Marktwert des Managers bzw. macht Firma zum Ziel feindlicher Übernahmen"],["**Eigentümerstruktur & Satzung (Charter)**","Ex post","Stimmrechte, Eigentümerwechsel und gesellschaftsrechtliche Schranken korrigieren Fehlentwicklungen"]]},{"type":"remember","md":"Vollständige Beseitigung wäre unendlich teuer — das Optimum ist immer nur eine **Second-Best-Lösung**, bei der zusätzliche Kontrollkosten gleich den vermiedenen Agency-Verlusten sind."}],"standardAnswer":[{"type":"model_answer","title":"Klausurfertige Antwort (Principal-Agent & Mitigation)","md":"Between shareholders (==principal==) and management (==agent==), ==asymmetric information== creates four conflicts: ==effort provision== (shirking, perquisites), ==risk preference== (excessive risk aversion), ==time preference== (short-termism), and ==overinvestment== of free cash flows (empire building).\n\nMitigation relies on ==ex-ante mechanisms== — higher debt (absorbing free cash flow and raising distress discipline), board monitoring, block owners, and long-term ==incentive-compatible pay== — plus ==ex-post mechanisms== — the managerial labor market, market for corporate control (takeovers), ownership structure, and company charter. Because monitoring is costly, only a ==second-best solution== is achievable."}],"tasks":[{"kind":"essay","id":"agency-mitigate","name":"Principal-Agent conflicts & mitigation (Ex ante vs. Ex post)","origin":"altklausur","originLabel":"FT23 / FT20 Q5 (10 P · Wahl vs. Ethik)","points":10,"question":"Comment on potential **Principal-Agent conflicts** between management and shareholders and explain **how to mitigate them**.","checklist":[{"text":"Definition: Principal (Shareholders) vs. Agent (Management), asymmetrische Information / Hidden Action","points":2},{"text":"Alle 4 Konflikte: Effort provision, Risk preference, Time preference, Overinvestment / Free Cash Flow","points":2},{"text":"Ex-ante Maßnahmen: Debt (Kapitalstruktur), Board Monitoring, Block Owners, Incentive Pay","points":2},{"text":"Ex-post Maßnahmen: Managerial labor market, Takeover market, Ownership structure, Charter","points":2},{"text":"Fazit: Second-Best-Lösung & Hinweis auf Anreizgestaltung (Vesting, keine neuen Exzesse)","points":2}],"modelAnswer":[{"type":"text","md":"Shareholders (principals) cannot perfectly observe managers (agents), causing ==effort provision==, ==risk/time preference==, and ==overinvestment== problems. Firms combine ==ex-ante== tools (debt pressure, supervisory board, blockholders, equity-based incentive pay) with ==ex-post== market discipline (managerial labor market, threat of takeovers, charter rules) to reach an optimal ==second-best== governance balance."}]},{"kind":"essay","id":"agency-debt","name":"How debt disciplines managers (Variante 2015)","origin":"altklausur","originLabel":"Old exam 2015, Q5 (10 P)","points":10,"question":"Discuss in the framework of the **Principal-Agent Theory** the idea that **debt can be used to discipline managers** of a firm.","checklist":[{"text":"Ausgangsproblem: Free Cash Flow / Overinvestment durch selbstinteressiertes Management","points":3},{"text":"Wirkung 1: Feste Zins- und Tilgungspflichten binden Free Cash Flow statt Empire Building","points":3},{"text":"Wirkung 2: Insolvenzgefahr erhöht Leistungsdruck (Job & Reputation stehen auf dem Spiel)","points":2},{"text":"Gegenkraft: Agency Costs of Debt (Asset Substitution, Debt Overhang / Underinvestment) begrenzen Schulden","points":2}],"modelAnswer":[{"type":"text","md":"Raising the ==debt-equity ratio== replaces discretionary dividends with hard interest and principal commitments, draining ==free cash flow== before management can waste it on negative-NPV empire building, while higher distress risk sharpens incentives. Because excessive leverage breeds ==agency costs of debt== (asset substitution, underinvestment), debt only disciplines profitably up to the optimal leverage ratio."}]},{"kind":"mc","id":"agency-mc","name":"Quick check: Equity vs. Debt Agency Conflicts","origin":"altklausur","questions":[{"q":"Welcher Mechanismus gehört zur EX-ANTE-Kontrolle (vorbeugend)?","options":["Markt für Unternehmenskontrolle (feindliche Übernahme nach Misswirtschaft)","Aufnahme von Fremdkapital zur Bindung des Free Cash Flow","Reputationsverlust auf dem Managerarbeitsmarkt"],"answer":1,"explain":"Kapitalstruktur (Debt), Board, Blockbesitzer und Vergütungsdesign sind vorbeugende Ex-ante-Kontrollen (Folie 89)."},{"q":"Welches typische Problem beschreibt 'Empire Building' durch Einbehaltung freier Mittel?","options":["Overinvestment / Free-Cash-Flow-Problem","Risk-Shifting der Aktionäre","Issuer-Pays-Konflikt"],"answer":0,"explain":"Überschüssiger Free Cash Flow wird in Projekte mit negativem Kapitalwert gesteckt statt ausgeschüttet."},{"q":"Welches Gegenproblem entsteht zwischen Gläubigern und Aktionären bei hoher Verschuldung?","options":["Asset Substitution (Überinvestition in zu riskante Projekte auf Kosten der Gläubiger)","Zu geringe Vergütung des Boards","Wegfall der Steuerersparnis"],"answer":0,"explain":"Nach Schuldenaufnahme profitieren Aktionäre vom Upside riskanter Projekte, während Gläubiger das Downside tragen."}]}],"cards":[{"id":"agency-c1","front":"Die 4 Eigenkapital-Agency-Probleme (Folie 87)","back":"1. Effort provision (Shirking / Perks) · 2. Risk preference · 3. Time preference · 4. Overinvestment (Free Cash Flow)"},{"id":"agency-c2","front":"Ex-ante vs. Ex-post Kontrolle (Folie 89)","back":"**Ex ante:** Debt, Board, Block owners, Vergütung · **Ex post:** Managerarbeitsmarkt, Takeovers, Eigentümerstruktur, Satzung"},{"id":"agency-c3","front":"Warum führt Agency Control nur zu einer Second-Best-Lösung?","back":"Vollständiges Monitoring und perfekte Verträge sind teurer als der verbleibende Restschaden."}],"mistakes":["Nur 2–3 Probleme aufzählen statt aller vier von Folie 87.","Die klare Trennung zwischen Ex-ante und Ex-post-Maßnahmen weglassen."],"hook":"**4 Probleme (Effort, Risk, Time, Free CF) → Ex ante vs. Ex post → Second Best**.","source":"Folien 86–89, Altklausuren 2015–2023 Q5."},"ethics":{"schema":"lernly.thema/1","id":"ethics","theory":[{"type":"simple","md":"Bei den **Capital-Market-Ethics-Fällen** (Wahlaufgabe Q6 gegen Agency) geht es fast immer um **Independence and Objectivity** (CFA Standards). Die goldene Regel lautet weder Verzicht noch öffentlicher Skandal, sondern **Full Disclosure (Offenlegung)** gegenüber Kunden bzw. Vorgesetzten plus interne **Compliance / Chinese Walls**."},{"type":"steps","title":"4-Schritte-Schema für jeden CFA-Ethik-Fall","items":["**Buchstabe UND Inhalt ausdrücklich nennen** (z. B. Antwort d — schreiben unter Offenlegung).","**Interessenkonflikt klar benennen:** Gefährdung von *Independence & Objectivity*.","**Richtige Lösung begründen:** Transparente **Offenlegung (Disclosure)** + Einhaltung interner Compliance / Information Barriers.","**Alle anderen Optionen gezielt verwerfen:** Unterscheiden zwischen *Überreaktion* (Social Media, Staatsanwaltschaft ohne Rechtsverstoß, Auftragsverzicht) und *Unterreaktion / Rechtsbruch* (geheim verschweigen, ohne Meinung berichten)."]},{"type":"example","title":"Die zwei echten Altklausur-Fälle","md":"- **Fall A (MaxCapital / Analystin Jones, FT23 d / FT20 b / FT20 Resit c):** M&A-Mandat & Partners im Board von XYZ. Jones darf den Research-Report **schreiben, sofern sie die besondere Beziehung vollständig offenlegt** (Chinese Walls wahren).\n- **Fall B (PE-Managerin Ms. Smith / Gastgeschenk, FT21 c):** Teures Geschenk beim Auslandstermin darf nur zur Vermeidung kultureller Beleidigung angenommen werden, **ist aber zwingend dem Vorgesetzten / Compliance offenzulegen** (damit die Firma entscheidet)."}],"standardAnswer":[{"type":"model_answer","title":"Klausurfertige Antwortvorlage (Ethics Case Q6)","md":"**Decision:** Option (d) — Jones may write the research report provided she ==fully discloses== the special relationship.\n\n**Reasoning:** MaxCapital's investment banking ties and partner board seats create a potential conflict that could impair ==independence and objectivity== under CFA standards, yet such relationships are legal and common. Full ==disclosure== enables investors to evaluate potential bias while keeping internal ==information barriers (Chinese walls)== intact.\n\n**Rejection of alternatives:** Refusing to write (a) or omitting an opinion (c) needlessly deprives clients of research; alerting prosecutors (b) or leaking via social media (e) is an unjustified overreaction and breaches employer loyalty without evidence of illegality."}],"tasks":[{"kind":"essay","id":"ethics-case-a","name":"Fall A: MaxCapital M&A-Mandat & Research-Report (FT23)","origin":"altklausur","originLabel":"FT23 Q6 (10 P · Wahl vs. Agency)","points":10,"question":"Analyst Jones works at MaxCapital (M&A advisor & partner board seats at XYZ) and is asked to write a research report on XYZ. Choose the best option (**a–e**) and justify why the chosen option is right and all others are wrong:\n- a) Refuse to write\n- b) Inform regulators / public prosecution\n- c) Write without expressing an opinion\n- d) Write and disclose the special relationship\n- e) Make the relationship public on social media","checklist":[{"text":"Korrekte Wahl: Option (d) + vollständiger Antwortsatz genannt","points":2},{"text":"Konflikt benannt: Independence and Objectivity (CFA Standards) gefährdet, aber legal","points":2},{"text":"Lösung: Full Disclosure an Leser + interne Chinese Walls / Compliance einhalten","points":2},{"text":"Optionen (a) und (c) begründet abgelehnt (unverhältnismäßig / wertlos ohne Empfehlung)","points":2},{"text":"Optionen (b) und (e) begründet abgelehnt (Überreaktion, keine Illegalität, Pflichtverletzung)","points":2}],"modelAnswer":[{"type":"text","md":"**Answer d):** Write the report with ==full disclosure==. The M&A relationship and board seats threaten ==independence and objectivity==, but transparency allows readers to assess potential bias while ==information barriers== prevent leakage. Options (a) and (c) harm clients unnecessarily; (b) and (e) escalate without illegal conduct and breach loyalty/compliance."}]},{"kind":"essay","id":"ethics-case-b","name":"Fall B: Ms. Smith & teures Gastgeschenk im Ausland (FT21)","origin":"altklausur","originLabel":"FT21 Q6 (10 P)","points":10,"question":"PE portfolio manager Ms. Smith receives a very expensive gift from the management of a target firm during a trip abroad, where refusing would be an insult. Discuss options **a–f** (give up deal / accept without condition / not OK without disclosure to supervisor / inform regulators / social media / donate to charity).","checklist":[{"text":"Korrekte Wahl: (c) Annahme nicht OK ohne Offenlegung beim Supervisor / Arbeitgeber","points":2},{"text":"Grundsatz: Geschenke von Zielunternehmen gefährden Independence & Objectivity","points":2},{"text":"Kulturkonflikt gelöst: höflich annehmen, aber umgehend Compliance/Vorgesetzte einbinden","points":2},{"text":"Unterreaktion (b) und Umgehung durch Spende (f) abgelehnt (Einflussnahme bleibt, Boss übergangen)","points":2},{"text":"Überreaktionen (a), (d) Behörden, (e) Social Media sauber widerlegt","points":2}],"modelAnswer":[{"type":"text","md":"**Answer c):** Accepting an expensive gift from a prospective target compromises ==independence and objectivity==. While local etiquette may prevent immediate refusal, it is unacceptable unless ==disclosed to the supervisor/employer== so the firm can take custody or apply compliance rules. Simply accepting (b) or donating (f) still bypasses employer oversight; walking away (a) or going to regulators/social media (d, e) overreacts and breaches confidentiality."}]},{"kind":"mc","id":"ethics-mc","name":"Quick check: CFA Ethics Golden Rule","origin":"altklausur","questions":[{"q":"Welches Grundprinzip löst sowohl Fall A (M&A-Beziehung im Research) als auch Fall B (teures Geschenk)?","options":["Sofortige Anzeige bei der Staatsanwaltschaft","Vollständige Offenlegung (Disclosure) + interne Compliance","Jedes Geschäft sofort abbrechen"],"answer":1,"explain":"CFA Standards verlangen bei legalen Interessenkonflikten transparente Offenlegung und Compliance-Kontrolle."},{"q":"Warum reicht im Geschenk-Fall (Fall B) eine private Spende an eine Wohltätigkeitsorganisation (Option f) nicht aus?","options":["Weil dadurch trotzdem die Aufsicht / der Vorgesetzte übergangen wird und eine Beeinflussung im Raum steht","Weil Spenden im PE-Geschäft illegal sind","Weil Kunden dann Social Media informieren müssen"],"answer":0,"explain":"Das Geschenk wurde wegen des Deals gegeben — der Arbeitgeber muss zwingend informiert werden und entscheiden."}]}],"cards":[{"id":"ethics-c1","front":"Welcher CFA-Standard ist in Fall A & B betroffen?","back":"**Independence and Objectivity** — zu schützen durch **Full Disclosure (Offenlegung)** und Compliance."},{"id":"ethics-c2","front":"Lösung Fall A (MaxCapital / Analystin rum emittieren?**","Niedrigerer Kupon, keine sofortige Verwässerung, reduziert *Asset Substitution*","Automatischer **Bail-in** in Bankkrisen (zählt zu AT1 unter Basel III)"]]}],"standardAnswer":[{"type":"model_answer","title":"Klausurfertige Antwort (Credit Rating Agencies)","md":"Credit rating agencies (S&P, Moody's, Fitch) assess a borrower's ==probability of default== on a scale from AAA to D (BBB− and above: ==investment grade==). Acting as third-party monitors, they reduce ==information asymmetry==, guide debt pricing, and serve regulatory capital rules.\n\nUnder the ==issuer-pays model==, the rated issuer pays the agency while investors read ratings for free. This creates ==conflicts of interest== (rating shopping, pre-2008 structured-finance bias), compounded by market oligopoly, ==procyclicality== (synchronized crisis downgrades triggering fire sales), and lagging reactions."}],"tasks":[{"kind":"essay","id":"ratings-cra","name":"Role & critique of Credit Rating Agencies (FT23 Q3)","origin":"altklausur","originLabel":"FT23 / FT20 / FT21 Q3 (5–7 P)","points":6,"question":"Briefly explain and discuss the role of **Credit Rating Agencies**, who pays whom, and what conflicts of interest arise.","checklist":[{"text":"Aufgabe: Probability of Default schätzen; Big Three (S&P, Moody's, Fitch)","points":1},{"text":"Skala: AAA bis D, Investment Grade (≥ BBB−) vs. High Yield","points":1},{"text":"Ökonomische Rolle: weniger Information Asymmetry, beeinflusst Cost of Debt & Regulierung","points":1},{"text":"Issuer-pays-Modell: Emittent zahlt Agentur, Investor nutzt kostenlos","points":1},{"text":"Conflict of Interest: Rating Shopping & falsche Anreize (z. B. 2007/08)","points":1},{"text":"Weitere Kritik: Procyclicality (Fire Sales), Oligopol, späte Reaktion, ESMA-Aufsicht","points":1}],"modelAnswer":[{"type":"text","md":"CRAs estimate ==probability of default== (AAA to D; investment grade ≥ BBB−), lowering ==information asymmetry== and influencing borrowing costs. Because the ==issuer pays==, agencies face ==conflicts of interest== (rating shopping), reinforce crises through ==procyclical== downgrades, react slowly, and operate as an oligopoly despite tighter EU/ESMA oversight."}]},{"kind":"essay","id":"ratings-coco","name":"Convertible Bonds vs. Contingent Convertibles (CoCos)","origin":"altklausur","originLabel":"FT21 & 2015 Q3 (6 P)","points":6,"question":"Briefly explain **Convertible Bonds** and **Contingent Convertible Bonds (CoCos)** and compare the rationale behind both instruments.","checklist":[{"text":"Convertible: Straight Bond + Wandlungsoption für den Investor → niedrigerer Kupon, weniger Asset Substitution","points":2},{"text":"CoCo: Anleihe wandelt bei vordefiniertem Bank-Trigger (CET1 / Non-Viability) automatisch in EK oder wird abgeschrieben","points":2},{"text":"CoCo-Rationale: Bail-in durch Gläubiger statt Steuerzahler (Bail-out), zählt zu AT1 unter Basel III","points":2}],"modelAnswer":[{"type":"text","md":"A ==convertible bond== grants the **investor** an option to swap debt for shares, lowering coupon costs and curbing asset-substitution agency conflicts. A ==CoCo bond== triggers automatic conversion or write-down at the **issuer's** distress threshold (e.g., low CET1 ratio), providing ==bail-in== loss absorption instead of taxpayer bail-outs and qualifying as Basel III AT1 capital."}]},{"kind":"mc","id":"ratings-mc","name":"Quick check: Ratings, Convertibles & CoCos","origin":"altklausur","questions":[{"q":"Wo liegt die Grenze zwischen Investment Grade und Sub-Investment Grade (High Yield)?","options":["Zwischen AA und A","Unterhalb von BBB− (bei S&P/Fitch)","Unterhalb von CCC"],"answer":1,"explain":"Ab BBB− (bzw. Baa3 bei Moody's) abwärts beginnt der High-Yield-/Junk-Bereich."},{"q":"Worin liegt der Kernunterschied bei der Wandlung zwischen Convertible Bond und CoCo?","options":["Beim Convertible entscheidet der Investor, beim CoCo ein vordefinierter Stress-Trigger","CoCos haben niemals Zinszahlungen","Convertibles können nur von Banken begeben werden"],"answer":0,"explain":"Convertibles geben dem Investor eine Call-Option bei gutem Kursverlauf; CoCos schützen Banken im Krisenfall."},{"q":"Warum gelten Credit Ratings als prozyklisch?","options":["Weil alle Emittenten jedes Jahr hochgestuft werden","Weil gebündelte Herabstufungen in Krisen Zwangsverkäufe und teurere Refinanzierung auslösen","Weil sie vom Steuerzahler finanziert werden"],"answer":1,"explain":"Viele institutionelle Investoren müssen sub-investment-grade Anleihen sofort abstoßen (Fire Sales)."}]}],"cards":[{"id":"ratings-c1","front":"Was bedeutet das Issuer-Pays-Modell bei Ratingagenturen?","back":"Der Emittent bezahlt das Rating → **Conflict of Interest / Rating Shopping** trotz kostenloser Nutzung durch Investoren."},{"id":"ratings-c2","front":"Grenze zum Sub-Investment Grade (High Yield)?","back":"Alles unter **BBB−** (S&P/Fitch) bzw. **Baa3** (Moody's)."},{"id":"ratings-c3","front":"Convertible Bond vs. CoCo Bond?","back":"**Convertible:** Investor wandelt bei hohem Aktienkurs · **CoCo:** Pflichtwandlung/-Abschreibung bei niedrigem Bank-CET1 (**Bail-in**)."}],"mistakes":["Convertible und CoCo verwechseln (Wahlrecht beim Investor vs. automatischer Krisen-Trigger).","Nur 'Conflict of interest' schreiben, ohne 'Issuer pays' und 'Procyclicality' zu erklären."],"hook":"**BBB− · Issuer pays · Procyclical · CoCo = Bank-Bail-in**.","source":"Folien 37–45, Altklausuren 2015–2023 Q3."}},"mocks":[{"schema":"lernly.probeklausur/1","id":"a","name":"Probeklausur A","subtitle":"Gerüst wie die Altklausuren","durationMin":30,"totalPoints":28,"items":[{"id":"a1","no":"Q1","partId":"I","topicId":"emh","points":10,"type":"open","question":"Explain the semi-strong form of market efficiency and one way to test it.","checklist":[{"text":"Prices contain all public information","points":4},{"text":"Fundamental analysis cannot earn excess returns","points":3},{"text":"Test: event study around announcements","points":3}],"solution":[{"type":"text","md":"Semi-strong: ==all public information== is in the price. Test with an ==event study==: the price should react immediately and fully to news, with no drift afterwards."}]},{"id":"a2","no":"Q2","partId":"I","topicId":"dcf","points":15,"type":"open","question":"CF 5m for 3 years, then 5.5m forever without growth. WACC 10%, market value of debt 20m, market cap 25m. Value the equity and give a recommendation.","checklist":[{"text":"PV of CF 1–3 = 12.43m","points":4},{"text":"\\(TV_3 = 55\\)m, PV = 41.32m","points":4},{"text":"Firm value 53.76m, equity 33.76m","points":4},{"text":"33.76m > 25m → undervalued → buy","points":3}],"solution":[{"type":"steps","items":["\\(PV = 5/1.1 + 5/1.1^2 + 5/1.1^3 = 12.43\\)m","\\(TV_3 = 5.5/0.10 = 55\\)m, \\(PV = 55/1.1^3 = 41.32\\)m","Firm value 53.76m − debt 20m = equity **33.76m**","33.76m > 25m → **buy**"]}]},{"id":"a3","no":"Q3","partId":"I","topicId":"dcf","points":3,"type":"mc","question":"Quick check","questions":[{"q":"TV at t = 3 is discounted with …","options":["\\(1.1^2\\)","\\(1.1^3\\)","\\(1.1^4\\)"],"answer":1,"explain":"It sits at t = 3."},{"q":"Subtract which debt?","options":["book","market"],"answer":1,"explain":"Market value."},{"q":"Value per share = ?","options":["firm value / shares","equity / shares"],"answer":1,"explain":"Equity per share."}]}]}],"cheatsheet":{"schema":"lernly.spickzettel/1","sections":[{"title":"DCF","blocks":[{"type":"formula","tex":["TV_3=\\frac{CF_4}{\\text{WACC}-g}","E = V - D_{\\text{market}}"]}]},{"title":"Market efficiency","blocks":[{"type":"text","md":"- Weak: past prices\n- Semi-strong: + public\n- Strong: + private"}]}]},"meta":{"builtAt":"2026-11-14T00:25","generator":"lernly-plugin 0.1.0"}}</script>

    case "formula": { const tex = Array.isArray(b.tex) ? b.tex : [b.tex]; return `<div class="fxm">${tex.map(t => texSpan(t, true)).join("")}${b.note ? `<div class="note">${md(b.note, true)}</div>` : ""}</div>`; }

// ======================================================= scores
function taskScore(t) {
  if (t.kind === "drill") { const d = S.drills[t.id]; if (!d || !d.hist || !d.hist.length) return null; const h = d.hist.slice(-3); return h.reduce((a, b) => a + b, 0) / h.length; }
  if (t.kind === "essay") { const e = S.essays[t.id]; return e && e.done ? e.score / t.points : null; }
  if (t.kind === "mc") { const m = S.mc[t.id]; return m && m.checked ? m.score / t.questions.length : null; }
  return null;
}
function memoStats(tid) {
  const cs = tid ? cardsOf(tid) : ALLCARDS; let ok = 0, learn = 0, nw = 0;
  for (const c of cs) { const st = S.cards[c.id]; if (!st) nw++; else if (st.ivl >= 60) ok++; else learn++; }
  return { n: cs.length, ok, learn, nw };
}
function topicStat(id) {
  if (!TH[id]) return { mastery: 0, avg: 0, done: 0, total: 0, status: "missing" };
  const tasks = tasksOf(id), sc = tasks.map(taskScore).filter(x => x !== null);
  for (const k in S.mock) { const r = S.mock[k]; if (r && r.topic && r.topic[id] && r.topic[id][1]) sc.push(r.topic[id][0] / r.topic[id][1]); }
  const avg = sc.length ? sc.reduce((a, b) => a + b, 0) / sc.length : 0;
  const done = tasks.filter(t => taskScore(t) !== null).length;
  const cov = tasks.length ? done / tasks.length : (sc.length ? 1 : 0);
  const practice = sc.length ? avg * (0.6 + 0.4 * cov) : 0;
  const ms = memoStats(id), memo = ms.n ? (ms.ok + 0.4 * ms.learn) / ms.n : null, rd = S.read[id] ? 1 : 0;
  const m = memo === null ? 0.15 * rd + 0.85 * practice : 0.15 * rd + 0.7 * practice + 0.15 * memo;
  const mastery = Math.round(m * 100);
  let status = "new";
  if (rd || sc.length || (ms.n && ms.nw < ms.n)) status = "started";
  if (sc.length && avg < 0.6) status = "weak"; else if (mastery >= 75) status = "solid";
  return { mastery, avg, done, total: tasks.length, status };
}
function prioScore(id) {
  const st = topicStat(id); let f = 1;
  if (PAIR[id] && topicStat(PAIR[id]).mastery >= 70) f = 0.35;
  return EXP[id] * (1 - st.mastery / 100) * f * (st.status === "weak" ? 1.2 : 1);
}
const STATUS = { new: ["nicht begonnen", "c-lo"], started: ["läuft", "c-md"], weak: ["hakt", "c-hi"], solid: ["sitzt", "c-ok"], missing: ["kommt noch", "c-lo"] };
const statusColor = s => s === "solid" ? "var(--ok)" : s === "weak" ? "var(--bad)" : "var(--pri-hi)";
const partOf = t => { const p = (t.slotIds || []).map(x => PART_OF_SLOT[x]).find(Boolean); return p ? p.id : null; };
const slotLabel = t => (t.slotIds || []).map(x => SLOT[x] ? SLOT[x].label : "").filter(Boolean).join(" / ");
function pointsNow() {
  const seen = new Set(), parts = {}; let got = 0, tot = 0;
  for (const t of TOPICS) {
    if (seen.has(t.id)) continue;
    let m = topicStat(t.id).mastery, e = EXP[t.id];
    if (PAIR[t.id]) { seen.add(PAIR[t.id]); m = Math.max(m, topicStat(PAIR[t.id]).mastery); e = Math.max(e, EXP[PAIR[t.id]] || 0); }
    seen.add(t.id); got += e * m / 100; tot += e;
    const pid = partOf(t); if (pid) { const p = parts[pid] || (parts[pid] = { got: 0, tot: 0 }); p.got += e * m / 100; p.tot += e; }
  }
  return { got, tot, parts, max: EXAM.totalPoints || Math.round(tot) };
}
const dueCards = () => ALLCARDS.filter(c => S.cards[c.id] && S.cards[c.id].due <= now());
function daysLeft() { if (!S.examDate) return null; const ex = new Date(S.examDate + "T" + (EXAM.time || "09:00")); return (ex - new Date()) / 864e5; }

function mockMax(M) { if (M.totalPoints) return M.totalPoints; const g = {}; let s = 0; for (const it of M.items) { if (it.choiceGroup) g[it.choiceGroup] = Math.max(g[it.choiceGroup] || 0, it.points); else s += it.points; } return s + Object.values(g).reduce((a, b) => a + b, 0); }

function summaryText() {

  const lines = [`LERNSTAND (Lernly) · ${C.title} · ${new Date().toLocaleDateString("de-DE")}`, `Kurs-ID: ${C.id}`, `Punkte jetzt: ${fmt(pn.got)} / ${pn.max}` + (dl !== null ? ` · Klausur ${dl < 0 ? "vorbei" : "in " + Math.ceil(dl) + " Tagen"}` : ""), "Themen (Mastery · Status · Aufgaben gemacht · schwache Aufgaben):"];
  for (const t of [...TOPICS].sort((a, b) => prioScore(b.id) - prioScore(a.id))) {
    const s = topicStat(t.id); const weak = tasksOf(t.id).filter(x => { const v = taskScore(x); return v !== null && v < 0.6; }).map(x => `${x.id} ${Math.round(taskScore(x) * 100)}%`);
    lines.push(`- ${t.id} | ${t.title} | ${s.mastery}% | ${STATUS[s.status][0]} | ${s.done}/${s.total}${S.read[t.id] ? " | Theorie gelesen" : ""}${weak.length ? " | schwach: " + weak.join(", ") : ""}`);
  }
  lines.push(`Karten: ${ms.ok} sicher · ${ms.learn} am Lernen · ${ms.nw} neu · ${dueCards().length} fällig`);
  const mk = MOCKS.filter(M => S.mock[M.id] && (S.mock[M.id].done || S.mock[M.id].mode === "learn"));
  if (mk.length) lines.push("Probeklausuren: " + mk.map(M => `${M.name} ${fmt(S.mock[M.id].score || 0, 1)}/${mockMax(M)}${S.mock[M.id].mode === "learn" ? " (Lernmodus)" : ""}`).join(" · "));

}

// ---- drill
function parseNum(s) {
  s = String(s).trim().replace(/[\s€%'$]/g, "").replace(/−/g, "-"); if (!s) return NaN;
  const c = s.lastIndexOf(","), d = s.lastIndexOf(".");
  if (c > -1 && d > -1) s = c > d ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (c > -1) s = /^-?\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, "") : s.replace(",", ".");
  return parseFloat(s);
}
function numOk(raw, f) {
  const v = f.answer, tol = f.tol != null ? f.tol : f.rel != null ? Math.abs(v) * f.rel : Math.max(Math.abs(v) * 0.005, 1e-9);
  const cands = [parseNum(raw), parseFloat(String(raw).trim().replace(/[\s€%'$]/g, "").replace(/\./g, "").replace(",", "."))];
  if (f.unit === "%") cands.push(parseNum(raw) * 100);
  return cands.some(x => isFinite(x) && Math.abs(x - v) <= tol + 1e-12);
}
function renderDrill(el, D_) {

  const p = V[cur.vi];
  el.innerHTML = `<div class="card"><div class="row" style="margin-bottom:8px"><b>${md(D_.name, true)}</b>${D_.originLabel ? `<span class="small">${md(D_.originLabel, true)}</span>` : ""}${V.length > 1 ? `<span class="chip c-lo">Variante ${cur.vi + 1}/${V.length}</span>` : ""}</div><div class="task">${md(p.text)}</div>
  <p class="small" style="margin:10px 0 0">Rechne auf Papier, trag die Ergebnisse ein (Rundungsunterschiede zählen nicht) und drück Enter.</p>
  <div style="margin-top:4px">${p.fields.map((f, i) => `<div class="inp" id="row${i}"><label for="f${i}">${md(f.label, true)}${f.unit ? ` <span class="unit">in ${esc(f.unit)}</span>` : ""}</label><input id="f${i}" inputmode="decimal" autocomplete="off" enterkeyhint="done"><span class="mk" id="mk${i}"></span></div>`).join("")}
  ${p.choice ? `<div class="inp" id="rowc"><label for="fc">${md(p.choice.label, true)}</label><select id="fc"><option value="">–</option>${p.choice.options.map(o => `<option>${esc(o)}</option>`).join("")}</select><span class="mk" id="mkc"></span></div>` : ""}</div>
  <div class="row" style="margin-top:12px"><button class="btn primary" id="chk">${ic("check")} Prüfen</button><button class="btn" id="sol">${ic("eye")} Lösung zeigen</button>${V.length > 1 ? `<button class="btn ghost" id="nw">${ic("refresh-cw")} Neue Zahlen<span class="kbdhint"> (N)</span></button>` : ""}</div>
  <div id="solBox" ${cur.checked ? "" : "hidden"} style="margin-top:12px"><h3>Lösungsweg</h3>${blocks(p.solution)}</div></div>`;
  const check = () => {

    if (!cur.checked) logDrill(all); cur.checked = true; $("#solBox").hidden = false; renderMath($("#solBox"));

  };
  $("#chk").onclick = check;
  $("#sol").onclick = () => { $("#solBox").hidden = false; renderMath($("#solBox")); if (!cur.checked) { logDrill(false); cur.checked = true; } };

  el.querySelectorAll(".inp input").forEach(inp => inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } }));
}
function logDrill(ok) { const s = S.drills[cur.id] || { n: 0, ok: 0, hist: [] }; s.n++; if (ok) s.ok++; s.hist = (s.hist || []).concat(ok ? 1 : 0).slice(-6); s.lastV = cur.vi; S.drills[cur.id] = s; save(); }

// ======================================================= WIEDERHOLEN (spaced repetition)
function capMin() { const dl = daysLeft(); if (dl === null || dl < 0) return 14 * 1440; return Math.round(Math.min(21, Math.max(2, dl / 3)) * 1440); }
function ivlAfter(st, r) { const iv = st ? st.ivl : 0, cap = capMin(); if (r === 0) return 1; if (r === 1) return Math.max(5, Math.round(iv * 1.2)); if (r === 2) return iv < 20 ? 20 : Math.min(cap, Math.round(iv * 2.5)); return Math.max(1440, Math.min(cap, iv * 4)); }
function ivlLabel(m) { return m >= 2880 ? Math.round(m / 1440) + " Tage" : m >= 1440 ? "1 Tag" : m >= 60 ? Math.round(m / 60) + " Std." : m + " Min."; }
function buildQueue(decks, dueOnly) {
  const cs = ALLCARDS.filter(c => decks.includes(c.d));
  const due = cs.filter(c => S.cards[c.id] && S.cards[c.id].due <= now()).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due);
  return dueOnly ? due : [...due, ...cs.filter(c => !S.cards[c.id])];
}
function renderMemoSession(el, decks, dueOnly) {
  sessBox = el;
  if (!sess) {
    const s = decks.length === 1 ? memoStats(decks[0]) : memoStats(null), q = buildQueue(decks, dueOnly);
    el.innerHTML = `<div class="card"><h3 style="margin-top:0">Auswendig lernen</h3><p class="lead" style="margin-top:0">Nur, was du in der Klausur 1:1 hinschreiben musst: Formeln, Definitionen, Listen, Gliederungen. Im Kopf beantworten, umdrehen, ehrlich bewerten.</p>
    <div class="stack" style="max-width:420px;margin:8px 0"><i class="s-ok" style="width:${s.n ? s.ok / s.n * 100 : 0}%"></i><i class="s-learn" style="width:${s.n ? s.learn / s.n * 100 : 0}%"></i><i class="s-new" style="width:${s.n ? s.nw / s.n * 100 : 0}%"></i></div><p class="small">${s.ok} sicher · ${s.learn} am Lernen · ${s.nw} neu (von ${s.n})</p>
    <button class="btn primary" id="ms" ${q.length ? "" : "disabled"}>${ic("play")} Starten (${q.length} Karten)</button></div>`;
    $("#ms").onclick = () => { sess = { decks, dueOnly, q, i: 0, flip: false, done: 0 }; renderCard(); };
    return;
  }
  renderCard();
}
function renderCard() {
  const el = sessBox, c = sess.q[sess.i];
  if (!c) {
    el.innerHTML = `<div class="card" style="text-align:center"><h3 style="margin-top:0">Runde geschafft</h3><p>${sess.done} Karten. Was du mit „Nochmal“ oder „Schwer“ bewertet hast, kommt in ein paar Minuten wieder.</p><button class="btn primary" id="again">Mit fälligen Karten weitermachen</button></div>`;
    $("#again").onclick = () => { sess.q = buildQueue(sess.decks, true); sess.i = 0; renderCard(); }; return;
  }
  const t = TOPIC(c.d), st = S.cards[c.id];
  el.innerHTML = `<div class="card fc"><div class="row" style="justify-content:space-between"><span class="chip c-pri">${md(t.title, true)}</span><span class="small">${sess.i + 1} / ${sess.q.length} · ${st ? "Wiederholung" : "neu"}</span></div><div class="q">${md(c.front)}</div>
  ${sess.flip ? `<div class="a">${md(c.back)}</div><div class="rates"><button class="rb g0" data-r="0">Nochmal<small>1 Min.</small></button><button class="rb g1" data-r="1">Schwer<small>${ivlLabel(ivlAfter(st, 1))}</small></button><button class="rb g2" data-r="2">Gut<small>${ivlLabel(ivlAfter(st, 2))}</small></button><button class="rb g3" data-r="3">Leicht<small>${ivlLabel(ivlAfter(st, 3))}</small></button></div>` : `<button class="btn primary" id="flip" style="align-self:flex-start;margin-top:auto">${ic("eye")} Antwort zeigen</button>`}
  <div class="kbd kbdhint">Leertaste = umdrehen · 1–4 = bewerten · Esc = beenden</div></div>`;
  if (!sess.flip) $("#flip").onclick = () => { sess.flip = true; renderCard(); };
  el.querySelectorAll("[data-r]").forEach(b => b.onclick = () => rate(+b.dataset.r));
  renderMath(el);
}
function rate(r) {
  const c = sess.q[sess.i], prev = S.cards[c.id], iv = ivlAfter(prev, r);
  S.cards[c.id] = { ivl: iv, reps: ((prev && prev.reps) || 0) + 1, due: now() + iv * 6e4 }; save(); sess.done++;
  if (r <= 1) { const pos = Math.min(sess.q.length, sess.i + (r === 0 ? 4 : 8)); sess.q.splice(pos, 0, c); }
  sess.i++; sess.flip = false; renderCard(); updDue();
}
function renderReview() {
  const due = dueCards().length;
  if (!ALLCARDS.length) { main.innerHTML = `<div class="card empty">Noch keine Karteikarten in diesem Kurs.</div>`; return; }
  main.innerHTML = `<div class="card"><h2>Wiederholen</h2><p class="lead" style="margin-top:0">Nur für das, was du aus dem Kopf hinschreiben musst. Rechnen übst du in den Themen.</p>

  ${ORDER.map(t => { const s = memoStats(t.id); if (!s.n) return ""; return `<div class="deckrow"><div><b>${md(t.title, true)}</b><div class="small">${s.ok}/${s.n} sicher</div></div><div class="stack"><i class="s-ok" style="width:${s.ok / s.n * 100}%"></i><i class="s-learn" style="width:${s.learn / s.n * 100}%"></i><i class="s-new" style="width:${s.nw / s.n * 100}%"></i></div><button class="go" data-d="${t.id}">starten</button></div>`; }).join("")}</div><div id="memoBox"></div>`;
  $("#due").onclick = () => { const decks = ORDER.map(t => t.id); sess = { decks, dueOnly: true, q: buildQueue(decks, true), i: 0, flip: false, done: 0 }; sessBox = $("#memoBox"); renderCard(); $("#memoBox").scrollIntoView({ behavior: "smooth" }); };
  main.querySelectorAll("[data-d]").forEach(b => b.onclick = () => go("themen", b.dataset.d, "memo"));
}

// ======================================================= PROBEKLAUSUR
function renderMock() {
  if (!MOCKS.length) { main.innerHTML = `<div class="card empty">Noch keine Probeklausur.<br>Sag Claude: <code>/lernly:probeklausur</code></div>`; return; }
  const M = MOCKS.find(x => x.id === view.arg) || MOCKS.find(x => x.id === S.lastMock) || MOCKS[0];
  S.lastMock = M.id; save();
  const mx = mockMax(M), dur = M.durationMin || EXAM.durationMin || 90;
  const st = S.mock[M.id] || (S.mock[M.id] = { ans: {}, mc: {}, tick: {}, start: null, done: false, choice: {}, rev: {} });
  st.rev = st.rev || {}; st.choice = st.choice || {};
  const shown = it => st.done || (st.mode === "learn" && st.rev[it.id]);
  clearInterval(mt);
  main.innerHTML = `<div class="card"><h2>Probeklausur</h2><p class="lead" style="margin-top:0">${M.subtitle ? md(M.subtitle, true) + ". " : ""}<b>Lernmodus</b>: Aufgabe lösen, Lösung sofort ansehen. <b>Klausurmodus</b>: ${dur} Minuten, Lösung am Ende.</p>
  <div class="row">${MOCKS.map(k => { const r = S.mock[k.id]; return `<button class="btn ${k.id === M.id ? "primary" : ""}" data-m="${esc(k.id)}">${esc(k.name)}${r && (r.done || r.mode === "learn") ? ` · ${fmt(r.score || 0, 1)}/${mockMax(k)}` : ""}</button>`; }).join("")}</div></div>
  <div class="simbar" id="simbar"></div><div id="paper"></div>`;
  main.querySelectorAll("[data-m]").forEach(b => b.onclick = () => go("probe", b.dataset.m));
  const bar = $("#simbar"), paper = $("#paper");
  if (!st.start && !st.done && st.mode !== "learn") {
    bar.innerHTML = `<button class="btn primary" id="gol">${ic("book-open")} Lernmodus</button><button class="btn" id="gom">${ic("timer")} Klausurmodus · ${dur}:00</button>`;
    $("#gol").onclick = () => { st.mode = "learn"; save(); renderMock(); renderMath(main); };
    $("#gom").onclick = () => { st.mode = "exam"; st.start = now(); save(); renderMock(); renderMath(main); };
    return;
  }
  const left = () => { const l = Math.max(0, dur * 60 - Math.floor((now() - st.start) / 1000)); return `${String(Math.floor(l / 60)).padStart(2, "0")}:${String(l % 60).padStart(2, "0")}`; };
  const tick = () => { const el = $("#tm"); if (el) el.textContent = st.done ? "beendet" : left(); };
  bar.innerHTML = st.mode === "learn" ? `<span class="timer">Lernmodus</span><span class="score">${fmt(st.score || 0, 1)}<small> / ${mx}</small></span><button class="btn ghost" id="rst">${ic("rotate-ccw")} Zurücksetzen</button>`
    : `<span class="timer" id="tm"></span>${st.done ? `<span class="score">${fmt(st.score, 1)}<small> / ${mx}</small></span>` : `<button class="btn primary" id="fin">${ic("check")} Abgeben und prüfen</button>`}<button class="btn ghost" id="rst">${ic("rotate-ccw")} Zurücksetzen</button>`;
  if (st.mode !== "learn") { tick(); if (!st.done) mt = setInterval(tick, 1000); }
  let armed = false; $("#rst").onclick = e => { if (!armed) { armed = true; e.currentTarget.lastChild.textContent = " Nochmal klicken"; return; } S.mock[M.id] = { ans: {}, mc: {}, tick: {}, start: null, done: false, choice: {}, rev: {} }; save(); renderMock(); };
  if ($("#fin")) $("#fin").onclick = () => { st.done = true; scoreMock(M); save(); renderMock(); renderMath(main); };
  const chosen = g => st.choice[g] || M.items.find(x => x.choiceGroup === g).id;
  const cardHtml = it => {
    let h = `<div class="qh"><b>${esc(it.no || "")}</b><span class="pts">${it.points} P</span>${it.choiceGroup ? `<label class="small"><input type="radio" name="ch-${esc(it.choiceGroup)}" data-ch="${esc(it.choiceGroup)}" value="${esc(it.id)}" ${chosen(it.choiceGroup) === it.id ? "checked" : ""}> diese werten</label>` : ""}</div><div>${md(it.question)}</div>`;
    if (it.type === "mc") {
      h += it.questions.map((m, qi) => { const key = it.id + "-" + qi; return `<div class="mc"><b>${qi + 1}. ${md(m.q, true)}</b>${m.options.map((o, oi) => { const sel = st.mc[key] === oi, cls = shown(it) ? (oi === m.answer ? "right" : sel ? "wrong" : "") : ""; return `<label class="${cls}"><input type="radio" name="${esc(key)}" data-mc="${esc(key)}" value="${oi}" ${sel ? "checked" : ""} ${shown(it) ? "disabled" : ""}><span>${"abcdefgh"[oi]}) ${md(o, true)}</span></label>`; }).join("")}${shown(it) && m.explain ? `<div class="ex">${md(m.explain, true)}</div>` : ""}</div>`; }).join("");
      if (st.mode === "learn" && !shown(it)) h += `<div class="row" style="margin-top:10px"><button class="btn primary" data-rev="${esc(it.id)}">${ic("check")} Antworten prüfen</button></div>`;
    } else {
      h += `<textarea data-a="${esc(it.id)}" placeholder="Deine Antwort (oder auf Papier)" ${shown(it) ? "readonly" : ""} style="margin-top:8px">${esc(st.ans[it.id] || "")}</textarea>`;
      if (st.mode === "learn" && !shown(it)) h += `<div class="row" style="margin-top:10px"><button class="btn primary" data-rev="${esc(it.id)}">${ic("eye")} Lösung zeigen</button></div>`;
      if (shown(it)) h += `<h4>Punkte-Checkliste: hak ab, was du wirklich hattest</h4>${it.checklist.map((c, ci) => `<label class="chk"><input type="checkbox" data-tk="${esc(it.id)}-${ci}" ${st.tick[it.id + "-" + ci] ? "checked" : ""}><span>${md(c.text, true)}</span><span class="pts">${c.points} P</span></label>`).join("")}<div class="ms"><div class="bh">${ic("pen-line")}Lösung</div>${blocks(it.solution, true)}</div>`;
    }
    return h;
  };
  const updScore = () => { const sce = $(".simbar .score"); if (sce) sce.firstChild.textContent = fmt(st.score, 1); if (!$("#resCard")) { const rc = document.createElement("div"); rc.className = "card"; rc.id = "resCard"; paper.appendChild(rc); } renderRes(M); };
  const bind = root => {
    root.querySelectorAll("textarea").forEach(t => t.oninput = () => { st.ans[t.dataset.a] = t.value; save(); });
    root.querySelectorAll("[data-mc]").forEach(r => r.onchange = () => { st.mc[r.dataset.mc] = +r.value; save(); });
    root.querySelectorAll("[data-ch]").forEach(r => r.onchange = () => { st.choice[r.dataset.ch] = r.value; save(); if (st.done || st.mode === "learn") { scoreMock(M); save(); updScore(); } });
    root.querySelectorAll("[data-tk]").forEach(c => c.onchange = () => { st.tick[c.dataset.tk] = c.checked; scoreMock(M); save(); updScore(); });
    root.querySelectorAll("[data-rev]").forEach(b => b.onclick = () => { const it = M.items.find(x => x.id === b.dataset.rev); st.rev[it.id] = true; scoreMock(M); save(); const card = document.getElementById("mq-" + it.id); card.innerHTML = cardHtml(it); bind(card); renderMath(card); updScore(); });
  };
  const parts = EXAM.parts || []; let lastPart = null;
  paper.innerHTML = M.items.map(it => {
    let h = "";
    if (it.partId && it.partId !== lastPart) { lastPart = it.partId; const p = parts.find(x => x.id === it.partId); h += `<div class="card" style="padding:10px 18px"><h3 style="margin:0">${esc(p ? p.name : it.partId)}${p && p.points ? ` · ${p.points} P` : ""}</h3></div>`; }
    return h + `<div class="card mq" id="mq-${esc(it.id)}">${cardHtml(it)}</div>`;
  }).join("") + (st.done || (st.mode === "learn" && Object.keys(st.rev).length) ? `<div class="card" id="resCard"></div>` : "");
  bind(paper);
  if (st.done || st.mode === "learn") renderRes(M);
}
function scoreMock(M) {
  const st = S.mock[M.id]; let sc = 0; const top = {};
  for (const it of M.items) {
    if (st.mode === "learn" && !st.done && !(st.rev || {})[it.id]) continue;
    if (it.choiceGroup) { const sel = st.choice[it.choiceGroup] || M.items.find(x => x.choiceGroup === it.choiceGroup).id; if (sel !== it.id) continue; }
    let got = 0;
    if (it.type === "mc") it.questions.forEach((m, qi) => { if (st.mc[it.id + "-" + qi] === m.answer) got++; });
    else it.checklist.forEach((c, ci) => { if (st.tick[it.id + "-" + ci]) got += c.points; });
    sc += got; if (it.topicId) { const t = top[it.topicId] || [0, 0]; t[0] += got; t[1] += it.points; top[it.topicId] = t; }
  }
  st.score = sc; st.topic = top;
}
function renderRes(M) {
  const st = S.mock[M.id], el = $("#resCard"); if (!el) return;
  const rows = Object.entries(st.topic || {}).filter(([k]) => TOPIC(k)).map(([k, v]) => ({ id: k, t: TOPIC(k).title, p: v[1] ? v[0] / v[1] : 0, v })).sort((a, b) => a.p - b.p);
  el.innerHTML = `<h3 style="margin-top:0">Ergebnis nach Thema, schwächstes zuerst</h3>${rows.length ? rows.map(r => `<button class="rk" data-t="${r.id}"><span class="rn"></span><span class="rl"><b>${md(r.t, true)}</b><small>${fmt(r.v[0], 1)} / ${r.v[1]} P</small></span><span class="rb2"><span class="track"><i style="width:${Math.round(r.p * 100)}%;background:${r.p >= .7 ? "var(--ok)" : r.p >= .5 ? "var(--pri-hi)" : "var(--bad)"}"></i></span></span><span class="rp">${Math.round(r.p * 100)}%</span><span class="chip ${r.p >= .7 ? "c-ok" : "c-hi"}">${r.p >= .7 ? "ok" : "reparieren"}</span></button>`).join("") : `<p class="small">Noch nichts bewertet.</p>`}`;
  renderMath(el);
  el.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go("themen", b.dataset.t, "practice"));
}

// ======================================================= SPICKZETTEL
function renderCheat() {
  if (!CHEAT || !CHEAT.sections || !CHEAT.sections.length) { main.innerHTML = `<div class="card empty">Noch kein Spickzettel.<br>Sag Claude: <code>/lernly:trainer-bauen spickzettel</code></div>`; return; }
  main.innerHTML = `<div class="card"><h2>Spickzettel</h2><p class="lead" style="margin-top:0">${CHEAT.intro ? md(CHEAT.intro, true) : "Der letzte Blick vor der Klausur: alles, was du aus dem Kopf können musst."}</p></div><div class="cheat">${CHEAT.sections.map(s => `<div class="cs"><h4>${md(s.title, true)}</h4>${blocks(s.blocks)}</div>`).join("")}</div>`;
}

// ======================================================= keyboard
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$("#modal").hidden) { if (e.key === "Escape") closeModal(); return; }
  const tag = (e.target.tagName || "").toLowerCase(); if (tag === "textarea" || tag === "input" || tag === "select") return;
  if (sess && sessBox && document.body.contains(sessBox)) {
    if (e.key === " ") { e.preventDefault(); if (!sess.flip && sess.q[sess.i]) { sess.flip = true; renderCard(); } return; }
    if (sess.flip && /^[1-4]$/.test(e.key)) { rate(+e.key - 1); return; }
    if (e.key === "Escape") { sess = null; render(); return; }
  }
  if ((e.key === "n" || e.key === "N") && $("#nw")) { $("#nw").click(); return; }
  if (/^[1-6]$/.test(e.key)) go(TABS[+e.key - 1][0]);
});

showBanner();
render();
</script>
</body>
